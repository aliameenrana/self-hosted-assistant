<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>assistant</title>
<style>
:root{--bg:#0e0e10;--panel:#141417;--fg:#e8e6e3;--dim:#8a8a93;--faint:#5a5a63;--line:#26262b;--accent:#c9a227}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 ui-sans-serif,system-ui,-apple-system,sans-serif;display:flex}
#side{width:236px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin-left .2s}
#side.hidden{margin-left:-236px}
#side header{padding:14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#side header b{font-size:13px;font-weight:600}
#newchat{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:3px 9px;font:inherit;font-size:12px;cursor:pointer}
#newchat:hover{color:var(--fg);border-color:var(--dim)}
#threads{flex:1;overflow-y:auto;padding:8px}
.thread{padding:7px 9px;border-radius:6px;cursor:pointer;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread:hover{background:#1c1c21;color:var(--fg)}
.thread.on{background:#1c1c21;color:var(--fg)}
.thread small{display:block;color:var(--faint);font-size:11px}
#acct{padding:12px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
#acct a,#acct button{color:var(--dim);font:inherit;font-size:12px;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
#acct a:hover,#acct button:hover{color:var(--fg)}
main{flex:1;display:flex;flex-direction:column;min-width:0}
#top{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}
#burger{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;padding:0 2px}
#who{font-size:13px;color:var(--dim);flex:1}
#who b{color:var(--accent);font-weight:600}
#switch{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:6px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer}
#switch:hover{color:var(--fg);border-color:var(--dim)}
#scroll{flex:1;overflow-y:auto}
#log{max-width:720px;margin:0 auto;padding:22px 18px 30px}
.msg{margin:16px 0;white-space:pre-wrap;word-wrap:break-word}
.msg.user{color:var(--dim)}
.msg.user::before{content:"> ";color:var(--line)}
.sysnote{color:var(--faint);font-size:12px;margin:18px 0;text-align:center}
#attached{max-width:720px;margin:0 auto 8px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 11px}
#attached b{color:var(--fg);font-weight:500}
#attached button{margin-left:auto;background:none;border:0;color:var(--dim);cursor:pointer;font:inherit}
#clip{display:flex;align-items:center;padding:0 9px;border:1px solid var(--line);border-radius:9px;cursor:pointer;background:var(--panel);font-size:15px}
#clip:hover{border-color:var(--dim)}
.artifact{margin-top:12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
.abar{display:flex;justify-content:space-between;align-items:center;padding:7px 11px;background:var(--panel);border-bottom:1px solid var(--line)}
.abar b{font-size:12.5px;color:var(--fg)}
.abar a{font-size:12px;color:var(--dim)}
.artifact iframe{display:block;width:100%;height:420px;border:0;background:#fff}
details{margin-top:8px;font-size:12px;color:var(--dim)}
summary{cursor:pointer;list-style:none;opacity:.55}
summary::-webkit-details-marker{display:none}
summary:hover{opacity:1}
.tel{border-left:2px solid var(--line);padding:6px 0 6px 10px;margin-top:6px;line-height:1.65;font-family:ui-monospace,monospace;font-size:11.5px;white-space:pre-wrap}
.flag{color:#e06c5a;border-left-color:#e06c5a}
#hello{max-width:720px;margin:0 auto;padding:48px 18px 20px}
#hello h2{font-size:20px;font-weight:600;margin:0 0 6px}
#hello p{color:var(--dim);margin:0 0 22px;font-size:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px}
.card{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 13px;cursor:pointer;font:inherit;color:var(--fg)}
.card:hover{border-color:var(--dim)}
.card b{display:block;font-size:13.5px;font-weight:600}
.card span{display:block;color:var(--dim);font-size:12px;margin-top:2px}
form{padding:14px 18px 20px;border-top:1px solid var(--line)}
.row{max-width:720px;margin:0 auto;display:flex;gap:8px}
input[type=text]{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--fg);padding:11px 13px;border-radius:9px;font:inherit;font-size:14px}
input[type=text]:focus{outline:none;border-color:var(--dim)}
#send{background:var(--fg);border:0;color:var(--bg);padding:0 17px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
#send:disabled{opacity:.35;cursor:default}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:400px;width:92%}
dialog::backdrop{background:#000a}
dialog h3{margin:0 0 12px;font-size:14px}
@media(max-width:760px){#side{position:fixed;z-index:9;height:100%}#side.hidden{margin-left:-236px}}
</style>
</head>
<body>
<aside id="side">
  <header><b>chats</b><button id="newchat">new</button></header>
  <div id="threads"></div>
  <div id="acct"></div>
</aside>
<main>
  <div id="top">
    <button id="burger" title="toggle sidebar">☰</button>
    <div id="who">assistant</div>
  </div>
  <div id="scroll"><div id="hello"></div><div id="log"></div></div>
  <form id="f">
    <div id="attached" hidden></div>
    <div class="row">
      <label id="clip" title="attach a file">📎<input type="file" id="file" hidden
        accept=".pdf,.docx,.txt,.md,.csv,.json,.html,.py,.js,.ts,.sql,.yaml,.yml,.log"></label>
      <input type="text" id="q" placeholder="ask something" autocomplete="off" maxlength="4000">
      <button id="send" type="submit">send</button>
    </div>
  </form>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
